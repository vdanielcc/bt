<div *ngIf="auth.impersonating" class="impersonation-banner px-4 py-2 bg-amber-100 text-black flex items-center gap-2" role="status">
  <span class="truncate flex-1">Ingresando como {{ auth.getCurrentUser()?.nombreCompleto }} · Academia #{{ auth.getCurrentUser()?.academieId }}</span>
  <button mat-button type="button" [disabled]="returning || auth.refreshing" (click)="returnToAdministrator()">
    {{ returning ? 'Volviendo…' : 'Volver a administrador' }}
  </button>
</div>
<p *ngIf="returnError" role="alert">{{ returnError }}</p>
<div
  [class.container]="isVerticalLayout$ | async"
  class="toolbar text-default w-full px-6 flex items-center">
  <button
    (click)="openSidenav()"
    [class.hidden]="isDesktop$ | async"
    mat-icon-button
    type="button">
    <mat-icon svgIcon="mat:menu"></mat-icon>
  </button>

  <a
    *ngIf="isVerticalLayout$ | async"
    [routerLink]="['/']"
    class="ltr:mr-4 rtl:ml-4 flex items-center">
    <img
      alt="Logo"
      class="w-8 select-none"
      src="assets/img/logo/budo-tournaments.png" />
    <h1
      [class.hidden]="isDesktop$ | async"
      class="text-2xl font-bold tracking-wide ltr:pl-4 rtl:pr-4 m-0 select-none">
      {{ title$ | async }}
    </h1>
  </a>

  <a
    *ngIf="isHorizontalLayout$ | async"
    [class.hidden]="!(isDesktop$ | async)"
    class="support-button"
    href="https://api.whatsapp.com/send?phone=56973329100&text=Hola,%20necesito%20ayuda%20con%20el%20uso%20del%20sistema"
    mat-flat-button
    rel="noopener noreferrer"
    target="_blank">
    <mat-icon class="support-button__icon" svgIcon="logo:whatsapp"></mat-icon>
    {{ 'Soporte' | translate }}
  </a>

  <div
    *ngIf="(isVerticalLayout$ | async) && (isNavbarInToolbar$ | async)"
    [class.hidden]="!(isDesktop$ | async)"
    class="px-6 flex-none flex items-center">
    <vex-navigation-item
      *ngFor="let item of navigationItems$ | async"
      [item]="item"></vex-navigation-item>
  </div>

  <span class="flex-1"></span>

  <div class="-mx-1 flex items-center">
    <div class="px-1">
      <button (click)="openSearch()" mat-icon-button type="button">
        <mat-icon color="primary" svgIcon="mat:search"></mat-icon>
      </button>
    </div>

    <div class="px-1">
      <vex-toolbar-notifications></vex-toolbar-notifications>
    </div>

    <div class="px-1">
      <button (click)="openQuickpanel()" mat-icon-button type="button">
        <mat-icon color="primary" svgIcon="mat:bookmarks"></mat-icon>
      </button>
    </div>

    <div class="px-1">
      <button [matMenuTriggerFor]="languageMenu" mat-icon-button type="button">
        <mat-icon [svgIcon]="activeLanguage.flag"></mat-icon>
      </button>
    </div>

    <div *ngIf="userVisible$ | async" class="px-1">
      <vex-toolbar-user></vex-toolbar-user>
    </div>

    <mat-menu
      #languageMenu="matMenu"
      overlapTrigger="false"
      xPosition="before"
      yPosition="below">
      <button
        (click)="selectLanguage(language)"
        *ngFor="let language of languages"
        mat-menu-item>
        <mat-icon [svgIcon]="language.flag"></mat-icon>
        <span>{{ language.label }}</span>
        <mat-icon *ngIf="language === activeLanguage" svgIcon="mat:check"></mat-icon>
      </button>
    </mat-menu>
  </div>
</div>

<vex-navigation
  *ngIf="(isVerticalLayout$ | async) && (isNavbarBelowToolbar$ | async)"
  [class.hidden]="!(isDesktop$ | async)"></vex-navigation>
