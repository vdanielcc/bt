<div class="bg-pattern w-full h-full flex flex-col items-center justify-center">
  <div [@fadeInUp] class="card overflow-hidden w-full max-w-md">
    <div class="language-selector">
      <mat-form-field subscriptSizing="dynamic">
        <mat-label>{{ 'auth.login.language' | translate }}</mat-label>
        <mat-select [value]="activeLanguage" (selectionChange)="selectLanguage($event.value)">
          <mat-option *ngFor="let language of languages" [value]="language">
            <mat-icon [svgIcon]="language.flag"></mat-icon>
            {{ language.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="p-6 pb-0 flex flex-col items-center justify-center">
      <div class="fill-current text-center">
        <img class="w-16" src="assets/img/logo/budo-tournaments.png" />
      </div>
    </div>

    <div class="text-center mt-4">
      <h2 class="title m-0">{{ 'auth.recovery.title' | translate }}</h2>
      <h4 class="body-2 text-secondary m-0">
        {{ 'auth.recovery.subtitle' | translate }}
      </h4>
    </div>

    <div [formGroup]="form" class="p-6 flex flex-col">
      <mat-form-field>
        <mat-label>{{ 'auth.recovery.email' | translate }}</mat-label>

        <mat-icon class="mr-2" matIconPrefix svgIcon="mat:mail"></mat-icon>
        <input formControlName="email" matInput required />
        <mat-error *ngIf="form.controls.email.hasError('required')">
          {{ 'auth.recovery.emailRequired' | translate }}
        </mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">
          {{ 'auth.recovery.emailInvalid' | translate }}
        </mat-error>
      </mat-form-field>

      <button
        (click)="send()"
        class="mt-2"
        color="primary"
        mat-raised-button
        type="button">
        {{ 'auth.recovery.submit' | translate }}
      </button>
    </div>
  </div>
</div>
