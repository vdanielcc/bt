<vex-secondary-toolbar [current]="'Dashboards' | translate">
  <vex-breadcrumbs
    [crumbs]="['Dashboards' | translate, 'Analytics' | translate]"
    class="flex-auto"></vex-breadcrumbs>

  <button class="ml-2" color="primary" mat-icon-button type="button">
    <mat-icon svgIcon="mat:more_vert"></mat-icon>
  </button>
</vex-secondary-toolbar>

<div class="container p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
  <vex-widget-assistant class="sm:col-span-2"></vex-widget-assistant>

  <vex-widget-quick-line-chart
    [options]="pageViewsOptions"
    [series]="pageViewsSeries"
    icon="mat:pageview"
    iconClass="text-primary-600 bg-primary-600/10"
    label="Visitantes únicos hoy"
    [detail]="visitsDetail"
    [value]="visitsToday"></vex-widget-quick-line-chart>

  <vex-widget-quick-line-chart
    [options]="uniqueUsersOptions"
    [series]="uniqueUsersSeries"
    icon="mat:group"
    iconClass="text-orange-600 bg-orange-600/10"
    label="Usuarios en línea"
    [detail]="onlineDetail"
    [value]="onlineUsers">
    <div *ngIf="canManageOnlineUsers" class="px-6 pb-3">
      <button mat-stroked-button color="primary" type="button" (click)="showOnlineUsers()">Ver usuarios en l�nea</button>
    </div>
  </vex-widget-quick-line-chart>

  <vex-widget-large-goal-chart
    [series]="salesSeries"
    class="sm:col-span-full"
    total="4,374"></vex-widget-large-goal-chart>

  <vex-widget-quick-value-center
    [change]="124.4"
    icon="mat:group"
    iconClass="text-primary-600 bg-primary-600/10"
    [label]="'Users' | translate"
    value="67.4k"></vex-widget-quick-value-center>
  <vex-widget-quick-value-center
    [change]="-23.7"
    helpText="Additional information"
    icon="mat:pageview"
    iconClass="text-orange-600 bg-orange-600/10"
    [label]="'Sessions' | translate"
    value="96.2k"></vex-widget-quick-value-center>
  <vex-widget-quick-value-center
    [change]="23.2"
    helpText="Explain something"
    icon="mat:cloud_off"
    iconClass="text-orange-600 bg-orange-600/10"
    [label]="'Bounce Rate' | translate"
    value="6.92%"></vex-widget-quick-value-center>
  <vex-widget-quick-value-center
    [change]="34.5"
    icon="mat:timer"
    iconClass="text-teal-600 bg-teal/10"
    [label]="'Session Duration' | translate"
    value="16m 48s"></vex-widget-quick-value-center>

  <vex-widget-large-chart
    [series]="userSessionsSeries"
    class="sm:col-span-2"></vex-widget-large-chart>

  <vex-widget-table
    [columns]="tableColumns"
    [data]="tableData"
    class="sm:col-span-2"></vex-widget-table>
</div>
